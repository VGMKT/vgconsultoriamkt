[build]
  command = "node -e \"const key = process.env.VITE_CLERK_PUBLISHABLE_KEY; console.log('[Clerk] VITE_CLERK_PUBLISHABLE_KEY configured:', Boolean(key), 'valid format:', Boolean(key && /^pk_(test|live)_/.test(key))); if (!key || !/^pk_(test|live)_/.test(key)) process.exit(1)\" && PUBLIC_CLERK_PUBLISHABLE_KEY=\"$VITE_CLERK_PUBLISHABLE_KEY\" pnpm --filter @workspace/vg-marketing run build"
  publish = "artifacts/vg-marketing/dist/public"

[build.environment]
  BASE_PATH = "/"

[[redirects]]
  from = "http://vgconsultoriamkt.com.br/*"
  to = "https://vgconsultoriamkt.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.vgconsultoriamkt.com.br/*"
  to = "https://vgconsultoriamkt.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sobre"
  to = "/sobre-a-vg/"
  status = 301
  force = true

[[redirects]]
  from = "/sobre/"
  to = "/sobre-a-vg/"
  status = 301
  force = true

[[redirects]]
  from = "/login"
  to = "/sign-in/"
  status = 301
  force = true

[[redirects]]
  from = "/login/"
  to = "/sign-in/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://clerk.vgconsultoriamkt.com.br https://*.clerk.com https://*.clerk.accounts.dev https://*.clerk.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://clerk.vgconsultoriamkt.com.br https://vgconsultoriamkt.onrender.com https://*.clerk.com https://*.clerk.accounts.dev https://*.clerk.dev https://challenges.cloudflare.com; frame-src 'self' https://clerk.vgconsultoriamkt.com.br https://*.clerk.com https://*.clerk.accounts.dev https://*.clerk.dev https://challenges.cloudflare.com; manifest-src 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"